<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dailies</title>
    <meta name="description"
        content="Track, play, and organize your favorite daily browser games all in one place. Countdown timer, favorites, completion tracking, and more.">
    <meta property="og:title" content="The Dailies">
    <meta property="og:description" content="Your personal daily games hub.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dailies.othuertas.com">
    <meta name="theme-color" content="#D4CCC0">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">

        <header class="header">
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                <!-- Icon set by JS -->
            </button>

            <div class="header-center">
                <h1>
                    <img id="wordmark" class="wordmark" src="assets/wordmark-dark.png" alt="The Dailies">
                </h1>
                <div id="counter" class="counter initial-enter">
                    <span id="counter-text">0/0</span>
                </div>
            </div>

            <div id="clock" class="clock" aria-label="Countdown to next reset">
                <!-- Built by clock.js -->
            </div>
        </header>

        <nav id="tab-bar" class="tab-bar" aria-label="Filter games by category">
            <!-- Built by app.js -->
        </nav>

        <main id="game-grid" class="game-grid" aria-label="Games list">
            <!-- Built by app.js -->
        </main>

        <footer class="footer">
            <a href="https://github.com/othuertas" class="footer-github" target="_blank" rel="noopener noreferrer"
                aria-label="GitHub profile">
                <svg viewBox="0 0 16 16" fill="currentColor">
                    <path
                        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
                </svg>
            </a>
            <p>
                <svg class="copyleft-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 980"
                    aria-label="Copyleft" role="img">
                    <circle cx="490" cy="490" r="440" fill="none" stroke="currentColor" stroke-width="100" />
                    <path d="M219,428H350a150,150 0 1 1 0,125H219a275,275 0 1 0 0-125z" fill="currentColor" />
                </svg>
                <span>2026. Ot Huertas</span>
            </p>
        </footer>

    </div>

    <script src="js/clock.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
